<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>கடவுச்சொல் / பயனர் பெயர் மீட்டமைப்பு (Reset Credentials)</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Modern Gradient Background */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-icon {
            font-size: 40px;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .logo-title {
            color: #2d3748;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #718096;
            font-size: 13px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .form-group i {
            position: absolute;
            top: 40px;
            left: 15px;
            color: #a0aec0;
            font-size: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #2d3748;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        .btn-success:hover {
            box-shadow: 0 10px 20px rgba(56, 161, 105, 0.3);
        }

        #otpSection {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px dashed #cbd5e0;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background-color: #f0fff4;
            color: #276749;
            padding: 12px;
            border-left: 4px solid #48bb78;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #718096;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #667eea;
        }
    </style>
</head>
<body>

    <div class="card">
        <i class="fa-solid fa-user-shield logo-icon"></i>
        <div class="logo-title">கடவுச்சொல் / பயனர் பெயர் மீட்டமைப்பு</div>
        <div class="subtitle">Official Account Password & Username Reset</div>

        <!-- Step 1: Identifier Input -->
        <div class="form-group">
            <label for="identifier">பதிவுசெய்யப்பட்ட மின்னஞ்சல் / மொபைல்:</label>
            <i class="fa-solid fa-envelope"></i>
            <input type="text" id="identifier" placeholder="Email or Mobile Number" required>
        </div>

        <button type="button" class="btn" id="sendOtpBtn" onclick="sendOTP()">
            <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> OTP அனுப்புக
        </button>

        <!-- Step 2: OTP & New Password Inputs -->
        <div id="otpSection">
            <div class="alert-success">
                <i class="fa-solid fa-circle-check"></i> OTP வெற்றிகரமாக அனுப்பப்பட்டது!
            </div>

            <div class="form-group">
                <label for="otpInput">OTP எண் (6 இலக்கம்):</label>
                <i class="fa-solid fa-comment-sms"></i>
                <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6">
            </div>

            <div class="form-group">
                <label for="newUsername">புதிய பயனர் பெயர்:</label>
                <i class="fa-solid fa-user"></i>
                <input type="text" id="newUsername" placeholder="உங்களின் புதிய Username">
            </div>

            <div class="form-group">
                <label for="newPassword">புதிய கடவுச்சொல்:</label>
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="newPassword" placeholder="உங்களின் புதிய கடவுச்சொல்">
            </div>

            <button type="button" class="btn btn-success" onclick="verifyAndReset()">
                <i class="fa-solid fa-floppy-disk" style="margin-right: 8px;"></i> விவரங்களை மாற்று
            </button>
        </div>

        <a href="/login" class="back-link">
            <i class="fa-solid fa-arrow-left" style="margin-right: 5px;"></i> உள்நுழைவு பக்கத்திற்குத் திரும்புக
        </a>
    </div>

    <script>
        async function sendOTP() {
            const identifier = document.getElementById('identifier').value.trim();

            if (!identifier) {
                alert('தயவுசெய்து மின்னஞ்சல் அல்லது மொபைல் எண்ணை உள்ளிடவும்!');
                return;
            }

            // பட்டனில் Loading அனிமேஷன் காட்டுவதற்கு
            const btn = document.getElementById('sendOtpBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> அனுப்புகிறது...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/forgot-password-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('otpSection').style.display = 'block';
                    btn.style.display = 'none'; 
                } else {
                    alert('பிழை: ' + data.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Server உடன் தொடர்புகொள்ள முடியவில்லை!');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function verifyAndReset() {
            const identifier = document.getElementById('identifier').value.trim();
            const otp = document.getElementById('otpInput').value.trim();
            const newUsername = document.getElementById('newUsername').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();

            if (!otp || !newUsername || !newPassword) {
                alert('அனைத்து விவரங்களையும் சரியாக உள்ளிடவும்!');
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-credentials', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, otp, newUsername, newPassword })
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    window.location.href = '/login';
                } else {
                    alert('பிழை: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('விவரங்களை மாற்ற முடியவில்லை!');
            }
        }
    </script>
</body>
</html>
